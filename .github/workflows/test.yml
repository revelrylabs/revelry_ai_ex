name: Tests and Formatter
# Borrows heavily from https://fly.io/phoenix-files/github-actions-for-elixir-ci/

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-22.04
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    env:
      MIX_ENV: test
    strategy:
      matrix:
        include:
          - otp: "26"
            elixir: "1.16"
          - otp: "28.4"
            elixir: "1.20.1"
    steps:
      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        env:
          cache_name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-

      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        env:
          cache-name: cache-compiled-build
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-elixir-${{ matrix.elixir }}-${{
            hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-elixir-${{ matrix.elixir }}-
            ${{ runner.os }}-mix-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile and fail on warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        if: matrix.elixir == '1.20.1' && matrix.otp == '28.4'
        run: mix format --check-formatted

      - name: Cache PLT files for Dialyzer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash
          key: plt-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
          restore-keys: |
            plt-cache-

      - name: Check function specs with Dialyzer
        if: matrix.elixir == '1.20.1' && matrix.otp == '28.4'
        run: mix dialyzer

      - name: Run tests
        run: mix test
